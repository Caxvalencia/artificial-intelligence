<div class="app-container">
  <!-- TOP BAR -->
  <app-header
    [isLoaded]="dataService.isLoaded"
    [loadProgress]="dataService.loadProgress"
    [backendSelection]="backendSelection"
    [isWebGPUSupported]="trainingService.isWebGPUSupported"
    (backendSelectionChange)="onBackendSelectionChange($event)"
  ></app-header>

  <!-- MAIN WORKSPACE LAYOUT -->
  <div class="studio-layout">
    <!-- LEFT SIDE: NODE WORKSPACE OR CHARTS (TABS) -->
    <div class="left-workspace-panel">
      <!-- TABS DE NAVEGACIÓN DEL WORKSPACE -->
      <div class="workspace-tabs-header">
        <button
          class="workspace-tab-btn"
          [class.active]="leftTab === 'canvas'"
          (click)="leftTab = 'canvas'"
        >
          <i class="ti ti-binary"></i> Lienzo de Arquitectura
        </button>
        <button
          class="workspace-tab-btn"
          [class.active]="leftTab === 'charts'"
          (click)="leftTab = 'charts'"
        >
          <i class="ti ti-chart-line"></i> Gráficas de Aprendizaje
        </button>
      </div>

      <!-- CONTENIDOS -->
      <div [class.hidden]="leftTab !== 'canvas'" class="workspace-tab-content">
        <app-workspace
          [layers]="layers"
          [selectedLayer]="selectedLayer"
          (layerSelected)="selectLayer($event)"
          (layerRemoved)="removeLayer($event)"
          (layerAdded)="addLayer($event)"
          (presetLoaded)="loadPreset($event)"
          (connectionMade)="onConnectionMade($event.outputLayerId, $event.inputLayerId)"
          (connectionCleared)="onConnectionCleared($event.layerId)"
        ></app-workspace>
      </div>

      <div [class.hidden]="leftTab !== 'charts'" class="workspace-tab-content charts-tab-content">
        <app-learning-charts [progress]="trainingProgress" [epochs]="epochs"></app-learning-charts>
      </div>
    </div>

    <!-- RIGHT SIDE: CONFIG PANEL & TESTING -->
    <div class="control-and-testing-panel">
      <!-- TABS DE NAVEGACIÓN PRINCIPAL -->
      <div class="main-tabs-header">
        <button
          class="main-tab-btn"
          [class.active]="mainTab === 'train'"
          (click)="mainTab = 'train'"
        >
          <i class="ti ti-settings"></i> Entrenamiento
        </button>
        <button class="main-tab-btn" [class.active]="mainTab === 'test'" (click)="mainTab = 'test'">
          <i class="ti ti-flask"></i> Pruebas (Tests)
        </button>
      </div>

      <!-- SECCIÓN ENTRENAMIENTO -->
      <div [class.hidden]="mainTab !== 'train'" class="tab-content-wrapper">
        <app-training-panel
          [layers]="layers"
          [selectedLayer]="selectedLayer"
          [(optimizer)]="optimizer"
          [(learningRate)]="learningRate"
          [(lossFunction)]="lossFunction"
          [(epochs)]="epochs"
          [(batchSize)]="batchSize"
          [trainingProgress]="trainingProgress"
          [isLoaded]="dataService.isLoaded"
          (compileModel)="compileModel()"
          (startTraining)="startTraining()"
          (exportModel)="exportModel()"
        ></app-training-panel>
      </div>

      <!-- SECCIÓN PRUEBAS -->
      <div [class.hidden]="mainTab !== 'test'" class="tab-content-wrapper">
        <app-testing-panel></app-testing-panel>
      </div>
    </div>
  </div>
</div>
